<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>AlumnConnect — Feed</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/assets/hugeicons.css">
  <link rel="stylesheet" href="/css/style.min.css">
  <style>
    /* Variables retained for JS-driven dynamic styles */
    :root {
      --bg: #090b09;
      --surface: #181b18;
      --surface2: #272a27;
      --border: #272a27;
      --border2: #3f463f;
      --text: #fafafa;
      --muted: #6b7280;
      --dim: #3d4852;
      --green: #006633;
      --green-dark: #004d26;
      --red: #8C1515;
      --green-light: #008844;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--surface2);
      border-radius: 2px;
    }

    /* Animations */
    @keyframes fadein {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes bounce-dot {

      0%,
      100% {
        transform: translateY(0)
      }

      50% {
        transform: translateY(-4px)
      }
    }

    .fi {
      animation: fadein .2s ease;
    }

    /* Role pills */
    .role-pill {
      display: inline-flex;
      align-items: center;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .04em;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 100px;
      margin-left: 6px;
    }

    .role-pill.alumni {
      background: rgba(201, 168, 76, .18);
      color: #c9a84c;
    }

    .role-pill.staff {
      background: rgba(99, 102, 241, .18);
      color: #818cf8;
    }

    .role-pill.student {
      background: rgba(0, 102, 51, .2);
      color: #4ade80;
    }

    /* Chat view slide */
    .chat-view {
      display: none;
      flex-direction: column;
      height: calc(100vh - 60px - 64px);
    }

    .chat-view.open {
      display: flex;
    }

    .chat-body {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* AI typing dots */
    .ai-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      animation: bounce-dot .9s ease-in-out infinite;
    }

    .ai-dot:nth-child(2) {
      animation-delay: .15s;
    }

    .ai-dot:nth-child(3) {
      animation-delay: .3s;
    }

    .ai-typing {
      display: none;
    }

    .ai-typing.show {
      display: flex;
    }

    /* Bubble media */
    .bubble-media {
      max-width: 100%;
      border-radius: 10px;
      max-height: 200px;
      object-fit: cover;
      display: block;
    }

    .post-media {
      width: 100%;
      border-radius: 12px;
      max-height: 400px;
      object-fit: cover;
      display: block;
    }

    /* Compose textarea auto-grow */
    .compose-ta {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 15px;
      resize: none;
      outline: none;
      min-height: 48px;
      line-height: 1.5;
      font-family: inherit;
    }

    .compose-ta::placeholder {
      color: var(--dim);
    }

    .chat-input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      resize: none;
      outline: none;
      font-size: 14px;
      line-height: 1.5;
      max-height: 80px;
      font-family: inherit;
    }

    .ai-input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      resize: none;
      outline: none;
      font-size: 14px;
      line-height: 1.5;
      max-height: 80px;
      font-family: inherit;
    }

    /* Empty state */
    .empty-icon {
      font-size: 40px;
      opacity: .4;
      margin-bottom: 10px;
    }

    /* Convo item */
    .convo-item.active {
      background: rgba(0, 102, 51, .15);
    }

    /* Profile banner pattern */
    .prof-banner {
      background: linear-gradient(135deg, #1e4b1b, var(--green-dark), #1e4b1b);
      height: 100px;
    }

    /* Desktop centering */
    @media(min-width:640px) {
      .botnav-inner {
        max-width: 480px;
        margin: 0 auto;
        border-radius: 20px 20px 0 0;
        border-left: 1px solid var(--border);
        border-right: 1px solid var(--border);
      }
    }

    input[type=file] {
      display: none;
    }

    /* Comments */
    .cmt-vote-btn {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 11px;
      font-weight: 600;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 6px;
      transition: background .15s, color .15s;
      color: var(--muted);
    }

    .cmt-vote-btn:hover {
      background: var(--surface2);
    }

    .cmt-vote-btn.up-active {
      color: #4ade80;
    }

    .cmt-vote-btn.down-active {
      color: var(--red);
    }

    .reply-indent {
      border-left: 2px solid var(--border2);
      margin-left: 14px;
      padding-left: 10px;
    }
  </style>
</head>

<body class="font-['DM_Sans',sans-serif] bg-[#090b09] text-[#fafafa] min-h-screen overflow-x-hidden">
  <!-- ── TOP NAV ── -->
  <nav
    class="fixed top-0 left-0 right-0 h-[60px] backdrop-blur-md border-b border-[#272a27] flex items-center justify-between px-4 z-[200]">
    <div class="flex items-center gap-2.5 font-bold text-base">
      <div
        class="w-8 h-8 rounded-[9px] bg-gradient-to-br from-[#006633] to-[#004d26] flex items-center justify-center text-base shrink-0">
        <i class="hgi hgi-stroke hgi-mortarboard-01 text-xl text-green_mid"></i>
      </div>
      <span>AlumnConnect</span>
    </div>
    <div class="flex items-center gap-2">
      <!-- AI button -->
      <button onclick="showPanel('ai')" title="AI Assistant"
        class="w-9 h-9 rounded-full border-none bg-[#181b18] cursor-pointer flex items-center justify-center text-[#6b7280] transition-all duration-150 hover:bg-[#272a27] hover:text-[#fafafa]">
        <i class="hgi hgi-stroke hgi-rounded hgi-ai-chat-01 text-xl"></i>
      </button>
      <!-- Avatar -->
      <div id="top-av" onclick="showPanel('profile')" title="Profile"
        class="w-[34px] h-[34px] rounded-full border-2 border-[#3f463f] cursor-pointer flex items-center justify-center text-xs font-bold text-white shrink-0 bg-[#006633] overflow-hidden">
      </div>
      <!-- Sign out -->
      <button onclick="window.location='/logout'" title="Sign out"
        class="w-9 h-9 rounded-full border-none bg-[#181b18] cursor-pointer flex items-center justify-center text-[#6b7280] transition-all duration-150 hover:bg-[#272a27] hover:text-[#fafafa]">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <polyline points="16 17 21 12 16 7" />
          <line x1="21" y1="12" x2="9" y2="12" />
        </svg>
      </button>
    </div>
  </nav>

  <!-- ── MAIN CONTENT ── -->
  <div class="pt-[72px] pb-[80px] max-w-[680px] mx-auto px-4 sm:px-6">
    <!-- ══ FEED PANEL ══ -->
    <div class="panel active" id="panel-feed">
      <!-- Compose card -->
      <div class="bg-[#181b18] border border-[#272a27] rounded-2xl overflow-hidden mb-3">
        <div class="p-3.5">
          <div class="flex gap-2.5 items-start">
            <div id="compose-av"
              class="w-10 h-10 rounded-full flex items-center justify-center text-sm font-bold text-white shrink-0 bg-[#006633]">
            </div>
            <div class="flex-1">
              <textarea id="post-ta" class="compose-ta" placeholder="What's on your mind?" rows="2"
                oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"></textarea>
              <div id="post-attach-preview"
                class="hidden items-center gap-2 bg-[#272a27] rounded-lg px-2.5 py-1.5 mt-2 text-xs text-[#6b7280]">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path
                    d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" />
                </svg>
                <span id="post-attach-name">file</span>
                <button onclick="clearPostAttach()"
                  class="ml-auto bg-transparent border-none text-[#3d4852] cursor-pointer text-base leading-none">✕</button>
              </div>
            </div>
          </div>
          <div class="flex items-center justify-between mt-2.5 pt-2.5 border-t border-[#272a27]">
            <div class="flex gap-1">
              <button onclick="document.getElementById('post-photo-input').click()" title="Photo"
                class="w-[34px] h-[34px] rounded-lg border-none bg-transparent text-[#6b7280] cursor-pointer flex items-center justify-center transition-all duration-150 hover:bg-[#272a27] hover:text-[#006633]">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="3" width="18" height="18" rx="2" />
                  <circle cx="8.5" cy="8.5" r="1.5" />
                  <polyline points="21 15 16 10 5 21" />
                </svg>
              </button>
              <button onclick="document.getElementById('post-doc-input').click()" title="Document"
                class="w-[34px] h-[34px] rounded-lg border-none bg-transparent text-[#6b7280] cursor-pointer flex items-center justify-center transition-all duration-150 hover:bg-[#272a27] hover:text-[#006633]">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                  <polyline points="14 2 14 8 20 8" />
                </svg>
              </button>
            </div>
            <button id="post-btn" onclick="submitPost()"
              class="bg-[#006633] border-none text-white px-[18px] py-2 rounded-[20px] text-[13px] font-semibold cursor-pointer transition-all duration-150 hover:bg-[#004d26] disabled:opacity-40 disabled:cursor-default">
              Post
            </button>
          </div>
        </div>
      </div>
      <input type="file" id="post-photo-input" name="image" accept="image/*,video/*"
        onchange="attachPostFile(this,'photo')">
      <input type="file" id="post-doc-input" name="doc" accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.txt"
        onchange="attachPostFile(this,'doc')">
      <div id="posts-list"></div>
    </div>

    <!-- ══ PEOPLE PANEL ══ -->
    <div class="panel hidden" id="panel-people">
      <!-- Search bar -->
      <div class="relative mb-3">
        <div class="absolute left-3.5 top-1/2 -translate-y-1/2 text-[#6b7280] pointer-events-none">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
          </svg>
        </div>
        <input id="people-search" placeholder="Search people, faculty, role..." oninput="searchPeople(this.value)"
          class="w-full bg-[#181b18] border border-[#272a27] rounded-2xl pl-10 pr-4 py-3 text-[14px] text-[#fafafa] placeholder-[#3d4852] outline-none focus:border-[#006633]">
      </div>
      <div class="bg-[#181b18] border border-[#272a27] rounded-2xl overflow-hidden" id="people-list"></div>
    </div>

    <!-- ══ MESSAGES PANEL ══ -->
    <div class="panel hidden" id="panel-messages">
      <div id="convo-view">
        <div class="bg-[#181b18] border border-[#272a27] rounded-2xl overflow-hidden">
          <div
            class="flex items-center gap-2.5 px-4 py-3 border-b border-[#272a27] text-sm font-semibold text-[#fafafa]">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
            </svg>
            Messages
          </div>
          <div id="convo-list-items"></div>
        </div>
      </div>

      <!-- Chat view -->
      <div class="chat-view bg-[#181b18] border border-[#272a27] rounded-2xl overflow-hidden" id="chat-view">
        <!-- Chat header -->
        <div class="flex items-center gap-3 px-4 py-3 border-b border-[#272a27] shrink-0">
          <button onclick="closeChat()"
            class="w-8 h-8 rounded-lg bg-transparent border-none cursor-pointer flex items-center justify-center text-[#6b7280] hover:bg-[#272a27] hover:text-[#fafafa]">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
              stroke-linecap="round">
              <polyline points="15 18 9 12 15 6" />
            </svg>
          </button>
          <div id="chat-hdr-av"
            class="w-9 h-9 rounded-full flex items-center justify-center text-xs font-bold text-white shrink-0"></div>
          <div>
            <div id="chat-hdr-name" class="text-sm font-bold"></div>
            <div id="chat-hdr-sub" class="text-xs text-[#6b7280]">IUIU Community</div>
          </div>
        </div>
        <div class="chat-body bg-[#090b09]" id="chat-body"></div>
        <div id="msg-attach-prev" class="hidden text-[11px] text-[#6b7280] px-3.5 py-1"></div>
        <!-- Chat input row -->
        <div class="flex items-end gap-2 px-3 py-3 border-t border-[#272a27] bg-[#181b18] shrink-0">
          <div class="flex gap-1 shrink-0">
            <button onclick="document.getElementById('msg-photo-input').click()"
              class="w-8 h-8 rounded-lg bg-transparent border-none cursor-pointer flex items-center justify-center text-[#6b7280] hover:bg-[#272a27] hover:text-[#006633]">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" />
                <circle cx="8.5" cy="8.5" r="1.5" />
                <polyline points="21 15 16 10 5 21" />
              </svg>
            </button>
            <button onclick="document.getElementById('msg-doc-input').click()"
              class="w-8 h-8 rounded-lg bg-transparent border-none cursor-pointer flex items-center justify-center text-[#6b7280] hover:bg-[#272a27] hover:text-[#006633]">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                <polyline points="14 2 14 8 20 8" />
              </svg>
            </button>
          </div>
          <div class="flex-1 bg-[#272a27] rounded-[18px] px-3.5 py-2 flex items-end gap-2 min-h-[38px]">
            <textarea id="chat-input" class="chat-input" placeholder="Message..." rows="1"
              oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,80)+'px'"
              onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg()}"></textarea>
          </div>
          <button onclick="sendMsg()"
            class="w-9 h-9 rounded-full bg-[#006633] border-none text-white cursor-pointer flex items-center justify-center shrink-0 transition-all duration-150 hover:bg-[#004d26]">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13" />
              <polygon points="22 2 15 22 11 13 2 9 22 2" />
            </svg>
          </button>
        </div>
        <input type="file" id="msg-photo-input" accept="image/*" onchange="attachMsgFile(this)">
        <input type="file" id="msg-doc-input" accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.txt"
          onchange="attachMsgFile(this)">
      </div>
    </div>

    <!-- ══ AI PANEL ══ -->
    <div class="panel hidden" id="panel-ai">
      <div class="bg-[#181b18] border border-[#272a27] rounded-2xl overflow-hidden flex flex-col"
        style="height:calc(100vh - 60px - 64px - 32px)">
        <!-- AI header -->
        <div
          class="flex items-center gap-2.5 px-4 py-3.5 border-b border-[#272a27] shrink-0 bg-gradient-to-r from-[rgba(0,102,51,0.08)] to-[rgba(0,77,38,0.08)]">
          <div
            class="w-10 h-10 rounded-xl bg-gradient-to-br from-[#006633] to-[#004d26] flex items-center justify-center text-[18px]">
            🤖</div>
          <div>
            <div class="text-sm font-bold">AlumnConnect AI</div>
            <div class="text-[11px] text-[#6b7280] flex items-center gap-1">
              <span class="inline-block w-1.5 h-1.5 rounded-full bg-[#006633]"></span>
              IUIU Alumni Assistant · Online
            </div>
          </div>
        </div>
        <!-- Quick chips -->
        <div class="flex gap-1.5 px-3.5 py-2.5 overflow-x-auto border-b border-[#272a27] shrink-0 scrollbar-none"
          style="-webkit-overflow-scrolling:touch">
          <button onclick="aiChip('Find a mentor in my field')"
            class="bg-[#272a27] border border-[#3f463f] text-[#6b7280] text-xs font-medium px-3 py-[5px] rounded-[20px] cursor-pointer whitespace-nowrap shrink-0 hover:border-[#006633] hover:text-[#006633] transition-all font-['DM_Sans',sans-serif]">🤝
            Find mentor</button>
          <button onclick="aiChip('What events are coming up?')"
            class="bg-[#272a27] border border-[#3f463f] text-[#6b7280] text-xs font-medium px-3 py-[5px] rounded-[20px] cursor-pointer whitespace-nowrap shrink-0 hover:border-[#006633] hover:text-[#006633] transition-all font-['DM_Sans',sans-serif]">📅
            Events</button>
          <button onclick="aiChip('How do I get my transcript?')"
            class="bg-[#272a27] border border-[#3f463f] text-[#6b7280] text-xs font-medium px-3 py-[5px] rounded-[20px] cursor-pointer whitespace-nowrap shrink-0 hover:border-[#006633] hover:text-[#006633] transition-all font-['DM_Sans',sans-serif]">📄
            Transcript</button>
          <button onclick="aiChip('What alumni benefits do I have?')"
            class="bg-[#272a27] border border-[#3f463f] text-[#6b7280] text-xs font-medium px-3 py-[5px] rounded-[20px] cursor-pointer whitespace-nowrap shrink-0 hover:border-[#006633] hover:text-[#006633] transition-all font-['DM_Sans',sans-serif]">🎁
            Benefits</button>
          <button onclick="aiChip('Tell me about IUIU')"
            class="bg-[#272a27] border border-[#3f463f] text-[#6b7280] text-xs font-medium px-3 py-[5px] rounded-[20px] cursor-pointer whitespace-nowrap shrink-0 hover:border-[#006633] hover:text-[#006633] transition-all font-['DM_Sans',sans-serif]">🏛️
            About IUIU</button>
        </div>
        <!-- Messages -->
        <div id="ai-msgs" class="flex-1 overflow-y-auto p-4 flex flex-col gap-2.5"></div>
        <!-- Typing indicator -->
        <div id="ai-typing" class="ai-typing items-center gap-2 px-4 pb-2">
          <div
            class="w-7 h-7 rounded-full bg-gradient-to-br from-[#006633] to-[#004d26] flex items-center justify-center text-[13px] shrink-0">
            🤖</div>
          <div class="bg-[#272a27] px-3 py-2.5 rounded-2xl rounded-bl-[4px] flex gap-1">
            <div class="ai-dot"></div>
            <div class="ai-dot"></div>
            <div class="ai-dot"></div>
          </div>
        </div>
        <!-- Input -->
        <div class="flex items-end gap-2 px-3 py-3 border-t border-[#272a27] bg-[#181b18] shrink-0">
          <div class="flex-1 bg-[#272a27] rounded-[18px] px-3.5 py-2 flex items-end">
            <textarea id="ai-input" class="ai-input" placeholder="Ask anything..." rows="1"
              oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,80)+'px'"
              onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();aiSend()}"></textarea>
          </div>
          <button onclick="aiSend()"
            class="w-9 h-9 rounded-full bg-[#006633] border-none text-white cursor-pointer flex items-center justify-center shrink-0 hover:bg-[#004d26] transition-all">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"
              stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13" />
              <polygon points="22 2 15 22 11 13 2 9 22 2" />
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- ══ PROFILE PANEL ══ -->
    <div class="panel hidden" id="panel-profile">
      <div class="bg-[#181b18] border border-[#272a27] rounded-2xl overflow-hidden mb-3">
        <!-- Banner -->
        <div class="prof-banner"></div>
        <!-- Avatar row -->
        <div class="flex items-end justify-between px-4 -mt-9 mb-3">
          <div id="prof-av-big" onclick="document.getElementById('av-upload').click()"
            class="w-[72px] h-[72px] rounded-full border-[3px] border-[#090b09] flex items-center justify-center text-2xl font-bold text-white overflow-hidden cursor-pointer relative bg-[#006633]">
            <img id="prof-av-img" src="" alt="" class="hidden w-full h-full object-cover">
            <span id="prof-av-initials"></span>
            <div
              class="absolute bottom-0 right-0 w-[22px] h-[22px] bg-[#006633] rounded-full flex items-center justify-center border-2 border-[#090b09] z-50">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
              </svg>
            </div>
          </div>
        </div>
        <!-- Profile info -->
        <div class="px-4 pb-4">
          <div id="prof-name" class="text-[18px] font-bold capitalize"></div>
          <div id="prof-handle" class="text-[#6b7280] text-[13px] mt-0.5 capitalize"></div>
          <div id="prof-bio" class="text-[#e4e4e7] text-[14px] mt-2 leading-relaxed"></div>
          <!-- Stats -->
          <div class="flex gap-5 mt-3">
            <div>
              <div id="stat-posts" class="text-base font-bold">0</div>
              <div class="text-[#6b7280] text-xs">Posts</div>
            </div>
          </div>
          <!-- User info card (shown on login/register) -->
          <div id="user-info-card" class="hidden mt-4 bg-[#090b09] border border-[#3f463f] rounded-xl p-4">
            <div class="text-[11px] font-bold text-[#6b7280] uppercase tracking-widest mb-3">Account info</div>
            <div class="flex flex-col gap-2">
              <div class="flex items-center gap-2 text-[13px]">
                <span class="text-[#6b7280]"><i class="hgi hgi-stroke hgi-rounded hgi-mail-open text-2xl"></i> </span>
                <span id="info-email" class="text-[#e4e4e7]"></span>
              </div>
              <div class="flex items-center gap-2 text-[13px]">
                <span class="text-[#6b7280]"><i class="hgi hgi-stroke hgi-rounded hgi-university text-2xl"></i> </span>
                <span id="info-faculty" class="text-[#e4e4e7]"></span>
              </div>
              <div class="flex items-center gap-2 text-[13px]">
                <span class="text-[#6b7280]"><i class="hgi hgi-stroke hgi-rounded hgi-calendar-01 text-2xl"></i> </span>
                <span id="info-year" class="text-[#e4e4e7]"></span>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div id="my-posts-list"></div>
      <input type="file" id="av-upload" accept="image/*" onchange="uploadAvatar(this)">
    </div>
  </div>

  <!-- ── BOTTOM NAV ── -->
  <nav class="fixed bottom-0 left-0 right-0 z-[200] bg-[rgba(9,9,11,.92)] backdrop-blur-md border-t border-[#272a27]">
    <div class="botnav-inner flex items-center justify-around px-2 h-16"
      style="padding-bottom:env(safe-area-inset-bottom,0px)">
      <button id="bnav-feed" onclick="showPanel('feed')"
        class="bnav flex-1 flex flex-col items-center gap-1 py-1.5 border-none bg-transparent cursor-pointer rounded-xl relative transition-all text-[#006633]">
        <i class="hgi hgi-stroke hgi-home-01" style="font-size:1.5rem;"></i>
        <span class="text-[10px] font-medium">Home</span>
      </button>
      <button id="bnav-people" onclick="showPanel('people')"
        class="bnav flex-1 flex flex-col items-center gap-1 py-1.5 border-none bg-transparent cursor-pointer rounded-xl relative transition-all text-[#3d4852]">
        <i class="hgi hgi-stroke hgi-students" style="font-size:1.5rem;"></i>
        <span class="text-[10px] font-medium">People</span>
      </button>
      <button id="bnav-messages" onclick="showPanel('messages')"
        class="bnav flex-1 flex flex-col items-center gap-1 py-1.5 border-none bg-transparent cursor-pointer rounded-xl relative transition-all text-[#3d4852]">
        <i class="hgi hgi-stroke hgi-message-add-01" style="font-size:1.5rem;"></i>
        <span class="text-[10px] font-medium">Messages</span>
        <div id="msg-badge"
          class="hidden absolute top-1 right-[calc(50%-14px)] w-[7px] h-[7px] bg-[#8C1515] rounded-full"></div>
      </button>
      <button id="bnav-ai" onclick="showPanel('ai')"
        class="bnav flex-1 flex flex-col items-center gap-1 py-1.5 border-none bg-transparent cursor-pointer rounded-xl relative transition-all text-[#3d4852]">
        <i class="hgi hgi-stroke hgi-ai-chat-01" style="font-size:1.5rem;"></i>
        <span class="text-[10px] font-medium">AI Chat</span>
      </button>
      <button id="bnav-profile" onclick="showPanel('profile')"
        class="bnav flex-1 flex flex-col items-center gap-1 py-1.5 border-none bg-transparent cursor-pointer rounded-xl relative transition-all text-[#3d4852]">
        <i class="hgi hgi-stroke hgi-student" style="font-size:1.5rem;"></i>
        <span class="text-[10px] font-medium">Profile</span>
      </button>
    </div>
  </nav>

  <script>
    let ME = null, aiHistory = [], activeConvo = null, msgPollTimer = null, postAttachFile = null, msgAttachFile = null, postAttachType = null;

    /* ── INIT ─────────────────────────────────────────────────── */
    async function init() {
      const r = await fetch('/api/me');
      if (r.status === 401) {window.location = '/login'; return;}
      ME = await r.json();

      const ini = initials(ME.name);
      const col = ME.avatar_color || '#6366f1';

      ['top-av', 'compose-av'].forEach(id => {
        const el = document.getElementById(id);
        if (el) {el.textContent = ini; el.style.background = col;}
      });

      document.getElementById('prof-av-initials').textContent = ini;
      document.getElementById('prof-av-big').style.background = col;
      document.getElementById('prof-name').textContent = ME.name;
      document.getElementById('prof-handle').textContent =
        (ME.role || '') + (ME.faculty ? ' · ' + ME.faculty : '') + (ME.entry_year ? ' · Entry ' + ME.entry_year : '');
      document.getElementById('prof-bio').textContent = ME.bio || '';

      // Populate info card
      if (ME.email || ME.faculty || ME.entry_year) {
        const card = document.getElementById('user-info-card');
        card.classList.remove('hidden');
        card.classList.add('flex', 'flex-col');
        document.getElementById('info-email').textContent = ME.email || '—';
        document.getElementById('info-faculty').textContent = ME.faculty || '—';
        document.getElementById('info-year').textContent = ME.entry_year ? 'Entry ' + ME.entry_year : '—';
      }

      if (ME.avatar) {
        setAvImg(ME.avatar);
      }

      loadPosts(); loadPeople(); loadConversations(); aiGreet();
      setInterval(loadConversations, 30000);
    }

    /* ── UTILS ────────────────────────────────────────────────── */
    function initials(n) {const p = n.trim().split(' '); return (p[0][0] + (p[1] ? p[1][0] : '')).toUpperCase();}
    function esc(s) {return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');}
    // Returns inner HTML for an avatar circle — photo if available, else coloured initials.
    function avatarHtml(name, avatarUrl, color) {
      if (avatarUrl) return `<img src="${esc(avatarUrl)}" style="width:100%;height:100%;object-fit:cover;border-radius:50%" alt="${esc(name)}">`;
      return initials(name);
    }
    function timeAgo(dt) {
      const d = new Date(dt.includes('Z') || dt.includes('+') ? dt : dt + 'Z');
      const s = Math.floor((Date.now() - d) / 1000);
      if (s < 60) return 'just now'; if (s < 3600) return Math.floor(s / 60) + 'm';
      if (s < 86400) return Math.floor(s / 3600) + 'h'; return Math.floor(s / 86400) + 'd';
    }
    function setAvImg(src) {
      const img = document.getElementById('prof-av-img'), ini = document.getElementById('prof-av-initials');
      img.src = src; img.classList.remove('hidden'); ini.style.display = 'none';
      document.getElementById('top-av').innerHTML = `<img src="${src}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`;
      document.getElementById('compose-av').innerHTML = `<img src="${src}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`;
    }

    /* ── PANEL SWITCHING ──────────────────────────────────────── */
    function showPanel(name) {
      document.querySelectorAll('.panel').forEach(p => {
        p.classList.remove('active');
        p.classList.add('hidden');
      });
      const active = document.getElementById('panel-' + name);
      active.classList.remove('hidden');
      active.classList.add('active');

      ['feed', 'people', 'messages', 'ai', 'profile'].forEach(n => {
        const btn = document.getElementById('bnav-' + n);
        if (!btn) return;
        btn.classList.toggle('text-[#006633]', n === name);
        btn.classList.toggle('text-[#3d4852]', n !== name);
      });

      if (name === 'messages') loadConversations();
      if (name === 'profile') loadMyPosts();
    }

    /* ── POSTS ────────────────────────────────────────────────── */
    function attachPostFile(inp, type) {
      postAttachFile = inp.files[0]; postAttachType = type;
      if (postAttachFile) {
        document.getElementById('post-attach-name').textContent = postAttachFile.name;
        document.getElementById('post-attach-preview').style.display = 'flex';
      }
    }
    function clearPostAttach() {
      postAttachFile = null;
      document.getElementById('post-attach-preview').style.display = 'none';
      document.getElementById('post-photo-input').value = '';
      document.getElementById('post-doc-input').value = '';
    }
    async function submitPost() {
      const ta = document.getElementById('post-ta');
      const content = ta.value.trim();
      if (!content && !postAttachFile) return;
      const fd = new FormData();
      fd.append('content', content);
      if (postAttachFile) fd.append('media', postAttachFile);
      ta.value = ''; ta.style.height = 'auto'; clearPostAttach();
      await fetch('/api/posts', {method: 'POST', body: fd});
      loadPosts();
    }
    async function loadPosts() {
      const r = await fetch('/api/posts'); const posts = await r.json();
      const myCount = posts.filter(p => p.user_id === ME.id).length;
      document.getElementById('stat-posts').textContent = myCount;
      renderPosts(posts, 'posts-list');
    }
    async function loadMyPosts() {
      const r = await fetch('/api/posts'); const posts = await r.json();
      const mine = posts.filter(p => p.user_id === ME.id);
      document.getElementById('stat-posts').textContent = mine.length;
      renderPosts(mine, 'my-posts-list');
    }
    function renderPosts(posts, containerId) {
      const el = document.getElementById(containerId);
      if (!posts.length) {
        el.innerHTML = `<div class="text-center py-12 text-[#3d4852]"><div class="empty-icon">✍️</div><div class="text-sm">No posts yet</div></div>`;
        return;
      }
      el.innerHTML = posts.map(p => {
        const roleClass = p.role === 'alumni' ? 'alumni' : p.role === 'staff' ? 'staff' : 'student';
        let mediaHtml = '';
        if (p.media_type && p.media_name) {
          if (p.media_type.startsWith('image/')) {
            mediaHtml = `
              <div class="mb-3">
                <img src="${p.media_name}" class="w-full rounded-xl aspect-[4/3] max-h-[450px] object-cover">
              </div>`;
          } else if (p.media_type.startsWith('video/')) {
            mediaHtml = `
              <div class="mb-3">
                <video controls class="w-full rounded-xl max-h-[450px] aspect-video">
                  <source src="${p.media_name}" type="${p.media_type}">
                </video>
              </div>`;
          } else {
            mediaHtml = `
              <div class="flex items-center gap-2 bg-[#272a27] rounded-xl px-3 py-2.5 mb-3">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                <span class="flex-1 overflow-hidden text-ellipsis whitespace-nowrap text-xs text-[#e4e4e7]">${esc(p.media_name)}</span>
                <button class="bg-[#006633] border-none text-white px-2 py-1 rounded-md text-xs cursor-pointer" onclick="downloadMedia(${p.id},'post')">↓</button>
              </div>`;
          }
        }
        return `<div class="bg-[#181b18] border border-[#272a27] rounded-2xl overflow-hidden mb-3 fi" id="post-${p.id}">
          <div class="p-3.5">
            <div class="flex gap-2.5 items-center mb-2.5">
              <div class="size-[38px] rounded-full overflow-hidden shrink-0 flex items-center justify-center font-bold text-white" style="background:${p.avatar_color || '#6366f1'}">
                ${p.user_avatar ? `<img src="${p.user_avatar}" class="w-full h-full object-cover rounded-full" alt="${esc(p.name)}">` : initials(p.name)}
              </div>
              <div class="flex-1">
                <div class="font-semibold text-[14px] leading-tight">${esc(p.name)}<span class="role-pill ${roleClass}">${p.role || 'member'}</span></div>
                <div class="text-[#6b7280] text-xs mt-px">${esc(p.faculty || 'IUIU')}</div>
              </div>
              <div class="text-[#3d4852] text-xs whitespace-nowrap">${timeAgo(p.created_at)}</div>
            </div>
            ${p.content ? `<div class="text-[14px] leading-relaxed text-[#e4e4e7] mb-3 whitespace-pre-wrap">${esc(p.content)}</div>` : ''}
            ${mediaHtml}
            <div class="flex items-center gap-3 mt-1">
              <button id="like-${p.id}" onclick="toggleLike(${p.id})"
                class="flex items-center gap-1.5 text-xs font-semibold transition-all ${p.liked ? 'text-[#8C1515]' : 'text-[#6b7280] hover:text-[#8C1515]'}">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="${p.liked ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                <span id="lc-${p.id}">${p.likes}</span>
              </button>
              <button onclick="toggleComments(${p.id})"
                class="flex items-center gap-1.5 text-xs font-semibold text-[#6b7280] hover:text-[#006633] transition-all" id="cmt-btn-${p.id}">
                <i class="hgi hgi-stroke hgi-rounded hgi-message-multiple-01 text-base"></i>
                <span id="cc-${p.id}">${p.comment_count || 0}</span>
              </button>
              ${p.user_id !== ME.id ? `<button onclick="openConvo(${p.user_id},'${esc(p.name)}','${p.avatar_color || '#6366f1'}','${esc(p.user_avatar || '')}')"
                class="flex items-center gap-1.5 text-xs font-semibold text-[#6b7280] hover:text-[#006633] transition-all">
                <i class="hgi hgi-stroke hgi-rounded hgi-message-add-01 text-base"></i>
              </button>` : ''}
            </div>
          </div>
          <!-- ── COMMENTS SECTION ── -->
          <div id="comments-${p.id}" class="hidden border-t border-[#272a27]">
            <div id="comments-body-${p.id}" class="px-3.5 py-3 flex flex-col gap-2.5"></div>
            <!-- Add comment row -->
            <div class="flex items-start gap-2.5 px-3.5 pb-3.5">
              <div class="w-7 h-7 rounded-full flex items-center justify-center text-[10px] font-bold text-white shrink-0 overflow-hidden" style="background:${ME ? (ME.avatar_color || '#006633') : '#006633'}" id="cmt-av-${p.id}">
                ${ME && ME.avatar ? `<img src="${ME.avatar}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">` : (ME ? initials(ME.name) : '')}
              </div>
              <div class="flex-1 bg-[#272a27] rounded-xl px-3 py-2 flex items-end gap-2 mb-3">
                <textarea id="cmt-ta-${p.id}" placeholder="Write a comment…" rows="1"
                  class="flex-1 bg-transparent border-none text-[#fafafa] text-[13px] resize-none outline-none font-['DM_Sans',sans-serif] leading-snug max-h-[80px]"
                  oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,80)+'px'"
                  onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();submitComment(${p.id})}"></textarea>
                <button onclick="submitComment(${p.id})"
                  class="w-7 h-7 rounded-full bg-[#006633] border-none text-white cursor-pointer flex items-center justify-center shrink-0 hover:bg-[#004d26] transition-all">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                </button>
              </div>
            </div>
          </div>
        </div>`;
      }).join('');

      document.querySelectorAll('.lazy-media[data-post-id]').forEach(img => {
        const pid = img.dataset.postId;
        fetch(`/api/posts/${pid}/media`).then(r => r.json()).then(d => {if (d.media) {img.src = d.media;} else {img.style.display = 'none';} });
      });
    }

    async function toggleLike(pid) {
      const r = await fetch(`/api/posts/${pid}/like`, {method: 'POST'});
      const d = await r.json();
      const btn = document.getElementById(`like-${pid}`);
      btn.className = `flex items-center gap-1.5 text-xs font-semibold transition-all ${d.liked ? 'text-[#8C1515]' : 'text-[#6b7280] hover:text-[#8C1515]'}`;
      btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="${d.liked ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg><span id="lc-${pid}">${d.likes}</span>`;
    }

    async function downloadMedia(id, type) {
      const url = type === 'post' ? `/api/posts/${id}/media` : `/api/messages/${activeConvo}/media/${id}`;
      const r = await fetch(url); const d = await r.json();
      if (d.media) {const a = document.createElement('a'); a.href = d.media; a.download = 'file'; a.click();}
    }

    /* ── PEOPLE ───────────────────────────────────────────────── */
    async function loadPeople(q = '') {
      const r = await fetch('/api/users' + (q ? `?q=${encodeURIComponent(q)}` : ''));
      const users = await r.json();
      const el = document.getElementById('people-list');
      if (!users.length) {
        el.innerHTML = `<div class="text-center py-12 text-[#3d4852]"><div class="empty-icon">👥</div><div class="text-sm">No users found</div></div>`;
        return;
      }
      el.innerHTML = users.map(u => {
        const roleClass = u.role === 'alumni' ? 'alumni' : u.role === 'staff' ? 'staff' : 'student';
        return `<div class="flex items-center gap-3 px-4 py-3 border-b border-[#272a27] last:border-b-0 fi">
          <div class="w-11 h-11 rounded-full overflow-hidden flex items-center justify-center text-[13px] font-bold text-white shrink-0" style="background:${u.avatar_color || '#6366f1'}">${avatarHtml(u.name, u.avatar, u.avatar_color)}</div>
          <div class="flex-1 min-w-0">
            <div class="text-sm font-semibold">${esc(u.name)}<span class="role-pill ${roleClass}">${u.role || 'member'}</span></div>
            <div class="text-xs text-[#6b7280] mt-px truncate">${esc(u.faculty || 'IUIU')}${u.entry_year ? ' · Entry ' + u.entry_year : ''}</div>
            ${u.bio ? `<div class="text-xs text-[#6b7280] mt-1 line-clamp-1">${esc(u.bio)}</div>` : ''}
          </div>
          <button onclick="openConvo(${u.id},'${esc(u.name)}','${u.avatar_color || '#6366f1'}','${esc(u.avatar || '')}')"
            class="w-9 h-9 rounded-full bg-[#272a27] border-none cursor-pointer flex items-center justify-center text-[#6b7280] hover:bg-[#006633] hover:text-white transition-all shrink-0">
            <i class="hgi hgi-stroke hgi-message-add-01" style="font-size:1.25rem;"></i>
          </button>
        </div>`;
      }).join('');
    }

    let searchTimer;
    function searchPeople(q) {clearTimeout(searchTimer); searchTimer = setTimeout(() => loadPeople(q), 300);}

    /* ── MESSAGES ─────────────────────────────────────────────── */
    async function loadConversations() {
      const r = await fetch('/api/conversations');
      const convos = await r.json();
      const el = document.getElementById('convo-list-items');
      const totalUnread = convos.reduce((a, c) => a + (c.unread || 0), 0);
      const badge = document.getElementById('msg-badge');
      badge.style.display = totalUnread > 0 ? 'block' : 'none';
      if (!convos.length) {
        el.innerHTML = `<div class="text-center py-12 text-[#3d4852]"><div class="empty-icon">💬</div><div class="text-sm">No conversations yet.<br>Find someone in People!</div></div>`;
        return;
      }
      el.innerHTML = convos.map(c => `
        <div onclick="openConvo(${c.id},'${esc(c.name)}','${c.avatar_color || '#6366f1'}','${esc(c.avatar || '')}')"
          class="flex items-center gap-3 px-4 py-3 border-b border-[#272a27] last:border-b-0 cursor-pointer hover:bg-[#272a27] transition-all ${activeConvo === c.id ? 'bg-[rgba(0,102,51,.15)]' : ''}">
          <div class="w-10 h-10 rounded-full overflow-hidden flex items-center justify-center text-xs font-bold text-white shrink-0" style="background:${c.avatar_color || '#6366f1'}">${avatarHtml(c.name, c.avatar, c.avatar_color)}</div>
          <div class="flex-1 min-w-0">
            <div class="text-sm font-semibold">${esc(c.name)}</div>
            <div class="text-xs text-[#6b7280] mt-px truncate">${esc(c.last_message || '')}</div>
          </div>
          <div class="flex flex-col items-end gap-1">
            <div class="text-[11px] text-[#3d4852]">${timeAgo(c.created_at)}</div>
            ${c.unread > 0 ? `<div class="w-5 h-5 bg-[#006633] rounded-full flex items-center justify-center text-[10px] font-bold text-white">${c.unread}</div>` : ''}
          </div>
        </div>`).join('');
    }

    async function openConvo(userId, name, color, avatar) {
      activeConvo = userId; clearInterval(msgPollTimer);
      showPanel('messages');
      document.getElementById('convo-view').style.display = 'none';
      const cv = document.getElementById('chat-view'); cv.classList.add('open');
      const hdrAv = document.getElementById('chat-hdr-av');
      hdrAv.style.background = color;
      hdrAv.style.overflow = 'hidden';
      hdrAv.innerHTML = avatarHtml(name, avatar, color);
      document.getElementById('chat-hdr-name').textContent = name;
      await fetchMsgs(userId);
      msgPollTimer = setInterval(() => fetchMsgs(userId), 4000);
      document.getElementById('chat-input').focus();
    }

    function closeChat() {
      clearInterval(msgPollTimer); activeConvo = null;
      document.getElementById('chat-view').classList.remove('open');
      document.getElementById('convo-view').style.display = 'block';
      loadConversations();
    }

    async function fetchMsgs(uid) {
      const r = await fetch(`/api/messages/${uid}`);
      const msgs = await r.json();
      const body = document.getElementById('chat-body');
      if (!body) return;
      if (!msgs.length) {
        body.innerHTML = `<div class="text-center py-12 text-[#3d4852]"><div class="empty-icon">👋</div><div class="text-sm">Say Assalamu Alaikum!</div></div>`;
        return;
      }
      body.innerHTML = msgs.map(m => {
        const mine = m.sender_id === ME.id;
        let mediaHtml = '';
        if (m.media_type && m.media_name) {
          if (m.media_type.startsWith('image/')) {
            mediaHtml = `<img src="" data-msg-id="${m.id}" class="bubble-media lazy-msg-media" alt="img">`;
          } else {
            mediaHtml = `<div class="flex items-center gap-2 bg-[#3f463f] rounded-xl px-2.5 py-2">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
              <span class="flex-1 overflow-hidden text-ellipsis whitespace-nowrap text-xs">${esc(m.media_name)}</span>
              <button class="bg-[#006633] border-none text-white px-2 py-1 rounded-md text-[11px] cursor-pointer" onclick="downloadMedia(${m.id},'msg')">↓</button>
            </div>`;
          }
        }
        return `<div class="flex ${mine ? 'justify-end' : 'justify-start'} fi">
          <div class="max-w-[78%]">
            ${mediaHtml}
            ${m.content ? `<div class="px-3.5 py-2.5 rounded-2xl text-[13.5px] leading-snug ${mine ? 'bg-[#006633] text-white rounded-br-[4px]' : 'bg-[#272a27] text-[#fafafa] rounded-bl-[4px]'}">${esc(m.content)}</div>` : ''}
            <div class="text-[11px] text-[#6b7280] mt-0.5 ${mine ? 'text-right' : ''}">${timeAgo(m.created_at)}</div>
          </div>
        </div>`;
      }).join('');
      document.querySelectorAll('.lazy-msg-media[data-msg-id]').forEach(img => {
        const mid = img.dataset.msgId;
        fetch(`/api/messages/${uid}/media/${mid}`).then(r => r.json()).then(d => {if (d.media) img.src = d.media;});
      });
      body.scrollTop = body.scrollHeight;
    }

    function attachMsgFile(inp) {
      msgAttachFile = inp.files[0];
      if (msgAttachFile) {
        const prev = document.getElementById('msg-attach-prev');
        prev.style.display = 'block'; prev.textContent = '📎 ' + msgAttachFile.name;
      }
    }

    async function sendMsg() {
      const input = document.getElementById('chat-input');
      const content = input.value.trim();
      if (!content && !msgAttachFile) return;
      const fd = new FormData();
      fd.append('content', content);
      if (msgAttachFile) {
        fd.append('media', msgAttachFile); msgAttachFile = null;
        document.getElementById('msg-attach-prev').style.display = 'none';
        document.getElementById('msg-photo-input').value = '';
        document.getElementById('msg-doc-input').value = '';
      }
      input.value = ''; input.style.height = 'auto';
      await fetch(`/api/messages/${activeConvo}`, {method: 'POST', body: fd});
      fetchMsgs(activeConvo); loadConversations();
    }

    /* ── AI ───────────────────────────────────────────────────── */
    function aiGreet() {
      const n = ME ? ME.name.split(' ')[0] : 'there';
      addAiMsg('bot', `Assalām ‘Alaykum, ${n}! 👋 I'm your IUIU alumni assistant. Ask me anything about mentors, events, transcripts, or university info.`);
    }
    async function aiSend() {
      const input = document.getElementById('ai-input');
      const text = input.value.trim(); if (!text) return;
      input.value = ''; input.style.height = 'auto';
      addAiMsg('user', text); aiHistory.push({role: 'user', content: text});
      document.getElementById('ai-typing').classList.add('show');
      try {
        const r = await fetch('/api/chat', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({messages: aiHistory})});
        const d = await r.json();
        document.getElementById('ai-typing').classList.remove('show');
        if (d.reply) {
          addAiMsg('bot', d.reply);
          aiHistory.push({role: 'assistant', content: d.reply});
        } else {
          aiHistory.pop(); // remove failed user msg so they can retry
          addAiMsg('bot', '\u26a0\ufe0f ' + (d.error || 'Something went wrong. Please try again.'));
        }
      } catch (e) {
        document.getElementById('ai-typing').classList.remove('show');
        aiHistory.pop();
        addAiMsg('bot', '\u26a0\ufe0f Could not reach the AI. Check your connection and try again.');
      }
    }
    function aiChip(t) {document.getElementById('ai-input').value = t; aiSend();}
    function addAiMsg(role, text) {
      const el = document.getElementById('ai-msgs');
      const div = document.createElement('div');
      div.className = `flex gap-2 fi ${role === 'user' ? 'flex-row-reverse' : ''}`;
      const fmt = esc(text).replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
      div.innerHTML = `
        <div class="w-7 h-7 rounded-full flex items-center justify-center text-[13px] shrink-0 self-end ${role === 'bot' ? 'bg-gradient-to-br from-[#006633] to-[#004d26]' : 'bg-[#272a27] text-[11px]'}">${role === 'bot' ? '🤖' : '👤'}</div>
        <div class="max-w-[78%] px-3.5 py-2.5 rounded-2xl text-[13.5px] leading-relaxed ${role === 'bot' ? 'bg-[#272a27] text-[#fafafa] rounded-bl-[4px]' : 'bg-[#006633] text-white rounded-br-[4px]'}">${fmt}</div>`;
      el.appendChild(div); el.scrollTop = el.scrollHeight;
    }

    /* ── COMMENTS ─────────────────────────────────────────────── */
    const openComments = new Set(); // track which post comment sections are open

    async function toggleComments(pid) {
      const section = document.getElementById(`comments-${pid}`);
      if (openComments.has(pid)) {
        openComments.delete(pid);
        section.classList.add('hidden');
      } else {
        openComments.add(pid);
        section.classList.remove('hidden');
        await loadComments(pid);
        // Refresh the current user's avatar in the compose row (in case avatar loaded after post render)
        const cmtAv = document.getElementById(`cmt-av-${pid}`);
        if (cmtAv && ME) {
          cmtAv.style.background = ME.avatar_color || '#006633';
          cmtAv.innerHTML = ME.avatar
            ? `<img src="${ME.avatar}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`
            : initials(ME.name);
        }
      }
    }

    async function loadComments(pid) {
      const body = document.getElementById(`comments-body-${pid}`);
      body.innerHTML = `<div class="text-xs text-[#3d4852] py-2 text-center">Loading…</div>`;
      const r = await fetch(`/api/posts/${pid}/comments`);
      const comments = await r.json();
      // Update comment count badge
      const total = comments.reduce((acc, c) => acc + 1 + (c.replies ? c.replies.length : 0), 0);
      const ccEl = document.getElementById(`cc-${pid}`);
      if (ccEl) ccEl.textContent = total;
      renderComments(pid, comments);
    }

    function renderComments(pid, comments) {
      const body = document.getElementById(`comments-body-${pid}`);
      if (!comments || !comments.length) {
        body.innerHTML = `<div class="text-xs text-[#3d4852] py-2 text-center">No comments yet. Be the first!</div>`;
        return;
      }
      body.innerHTML = comments.map(c => commentHtml(c, pid, false)).join('');
    }

    function commentHtml(c, pid, isReply) {
      const roleClass = c.role === 'alumni' ? 'alumni' : c.role === 'staff' ? 'staff' : 'student';
      const upClass = c.my_vote === 1 ? 'up-active' : '';
      const downClass = c.my_vote === -1 ? 'down-active' : '';
      const repliesHtml = (!isReply && c.replies && c.replies.length)
        ? `<div class="reply-indent mt-2 flex flex-col gap-2">${c.replies.map(r => commentHtml(r, pid, true)).join('')}</div>`
        : '';
      const replyBtn = !isReply
        ? `<button onclick="focusReply(${pid},${c.id})" class="cmt-vote-btn ml-1">Reply</button>`
        : '';
      const replyForm = !isReply
        ? `<div id="reply-form-${c.id}" class="hidden mt-2 flex items-start gap-2">
            <div class="w-6 h-6 rounded-full flex items-center justify-center text-[9px] font-bold text-white shrink-0 overflow-hidden" style="background:${ME ? (ME.avatar_color || '#006633') : '#006633'}">
              ${ME && ME.avatar ? `<img src="${ME.avatar}" class="size-6 object-cover rounded-full">` : (ME ? initials(ME.name) : '')}
            </div>
            <div class="flex-1 bg-[#272a27] rounded-xl px-3 py-1.5 flex items-end gap-2">
              <textarea id="reply-ta-${c.id}" placeholder="Reply…" rows="1"
                class="flex-1 bg-transparent border-none text-[#fafafa] text-[12px] resize-none outline-none font-['DM_Sans',sans-serif] leading-snug max-h-[60px]"
                oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,60)+'px'"
                onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();submitReply(${pid},${c.id})}"></textarea>
              <button onclick="submitReply(${pid},${c.id})"
                class="w-6 h-6 rounded-full bg-[#006633] border-none text-white cursor-pointer flex items-center justify-center shrink-0 hover:bg-[#004d26] transition-all">
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
              </button>
            </div>
           </div>`
        : '';

      return `<div class="fi" id="cmt-${c.id}">
        <div class="flex gap-2 items-start">
          <div class="w-7 h-7 rounded-full overflow-hidden flex items-center justify-center text-[10px] font-bold text-white shrink-0" style="background:${c.avatar_color || '#6366f1'}">
            ${c.avatar ? `<img src="${c.avatar}" class="size-6 object-cover rounded-full">` : initials(c.name)}
          </div>
          <div class="flex-1 min-w-0">
            <div class="bg-[#272a27] rounded-xl rounded-tl-[4px] px-3 py-2">
              <div class="flex items-center gap-1.5 mb-0.5">
                <span class="text-[12px] font-semibold">${esc(c.name)}</span>
                <span class="role-pill ${roleClass}" style="font-size:9px;padding:1px 5px">${c.role || 'member'}</span>
              </div>
              <div class="text-[13px] text-[#e4e4e7] leading-snug whitespace-pre-wrap">${esc(c.content)}</div>
            </div>
            <div class="flex items-center gap-0.5 mt-1 ml-1">
              <span class="text-[11px] text-[#3d4852] mr-1">${timeAgo(c.created_at)}</span>
              <button onclick="voteComment(${c.id},${pid},'up')" class="cmt-vote-btn ${upClass}" id="vote-up-${c.id}">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="${c.my_vote === 1 ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3H14z"/><path d="M7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg>
                <span id="vup-${c.id}">${c.thumbs_up}</span>
              </button>
              <button onclick="voteComment(${c.id},${pid},'down')" class="cmt-vote-btn ${downClass}" id="vote-dn-${c.id}">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="${c.my_vote === -1 ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2"><path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3H10z"/><path d="M17 2h2.67A2.31 2.31 0 0 1 22 4v7a2.31 2.31 0 0 1-2.33 2H17"/></svg>
                <span id="vdn-${c.id}">${c.thumbs_down}</span>
              </button>
              ${replyBtn}
            </div>
            ${replyForm}
            ${repliesHtml}
          </div>
        </div>
      </div>`;
    }

    async function submitComment(pid) {
      const ta = document.getElementById(`cmt-ta-${pid}`);
      const content = ta.value.trim();
      if (!content) return;
      ta.value = ''; ta.style.height = 'auto';
      await fetch(`/api/posts/${pid}/comments`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({content})
      });
      await loadComments(pid);
    }

    function focusReply(pid, commentId) {
      const form = document.getElementById(`reply-form-${commentId}`);
      if (!form) return;
      form.classList.toggle('hidden');
      if (!form.classList.contains('hidden')) {
        const ta = document.getElementById(`reply-ta-${commentId}`);
        if (ta) ta.focus();
      }
    }

    async function submitReply(pid, parentId) {
      const ta = document.getElementById(`reply-ta-${parentId}`);
      const content = ta.value.trim();
      if (!content) return;
      ta.value = ''; ta.style.height = 'auto';
      await fetch(`/api/posts/${pid}/comments`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({content, parent_id: parentId})
      });
      const form = document.getElementById(`reply-form-${parentId}`);
      if (form) form.classList.add('hidden');
      await loadComments(pid);
    }

    async function voteComment(commentId, pid, direction) {
      const r = await fetch(`/api/comments/${commentId}/vote/${direction}`, {method: 'POST'});
      const d = await r.json();
      // Update up button
      const upBtn = document.getElementById(`vote-up-${commentId}`);
      const dnBtn = document.getElementById(`vote-dn-${commentId}`);
      const upSpan = document.getElementById(`vup-${commentId}`);
      const dnSpan = document.getElementById(`vdn-${commentId}`);
      if (upBtn && upSpan) {
        upSpan.textContent = d.thumbs_up;
        upBtn.className = `cmt-vote-btn ${d.my_vote === 1 ? 'up-active' : ''}`;
        upBtn.querySelector('svg').setAttribute('fill', d.my_vote === 1 ? 'currentColor' : 'none');
      }
      if (dnBtn && dnSpan) {
        dnSpan.textContent = d.thumbs_down;
        dnBtn.className = `cmt-vote-btn ${d.my_vote === -1 ? 'down-active' : ''}`;
        dnBtn.querySelector('svg').setAttribute('fill', d.my_vote === -1 ? 'currentColor' : 'none');
      }
    }

    /* ── AVATAR UPLOAD ────────────────────────────────────────── */
    async function uploadAvatar(inp) {
      const file = inp.files[0];
      if (!file) return;

      const fd = new FormData();
      fd.append("avatar", file);

      const r = await fetch('/api/me/avatar', {
        method: 'POST',
        body: fd
      });

      const d = await r.json();

      if (d.ok) {
        ME.avatar = d.avatar;
        setAvImg(d.avatar);
      }
    }

    init();
  </script>
</body>

</html>
