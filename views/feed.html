<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>AlumnConnect</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090b09;
      --surface: #181b18;
      --surface2: #272a27;
      --border: #272a27;
      --border2: #3f463f;
      --text: #fafafa;
      --muted: #6b7280;
      --dim: #3d4852;
      --green: #006633;
      --green-dark: #004d26;
      --pink: #ec4899;
      --gold: #c9a84c;
      --teal: #10b981;
      --gold-light: #e8c96e;
      --red: #8C1515;
      --green-light: #008844;

      --nav-h: 60px;
      --bot-h: 64px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden
    }

    a {
      text-decoration: none;
      color: inherit
    }

    button {
      font-family: 'Inter', sans-serif
    }

    input,
    textarea,
    select {
      font-family: 'Inter', sans-serif
    }

    ::-webkit-scrollbar {
      width: 4px;
      height: 4px
    }

    ::-webkit-scrollbar-thumb {
      background: var(--surface2);
      border-radius: 2px
    }

    /* ── TOP NAV ── */
    .topnav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--nav-h);
      background: rgba(9, 9, 11, .85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }

    .topnav-logo {
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: 700;
      font-size: 16px
    }

    .topnav-logo-icon {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: linear-gradient(135deg, var(--green), var(--green-dark));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0
    }

    .topnav-right {
      display: flex;
      align-items: center;
      gap: 8px
    }

    .nav-icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: var(--surface);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      transition: .15s
    }

    .nav-icon-btn:hover {
      background: var(--surface2);
      color: var(--text)
    }

    .av-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2px solid var(--border2);
      cursor: pointer;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
      background: var(--green)
    }

    /* ── BOTTOM NAV ── */
    .botnav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: var(--bot-h);
      background: rgba(9, 9, 11, .92);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 8px;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    .botnav-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 6px 4px;
      border: none;
      background: transparent;
      color: var(--dim);
      cursor: pointer;
      transition: .15s;
      border-radius: 10px;
      position: relative
    }

    .botnav-btn.active {
      color: var(--green)
    }

    .botnav-btn span {
      font-size: 10px;
      font-weight: 500
    }

    .botnav-badge {
      position: absolute;
      top: 4px;
      right: calc(50% - 14px);
      width: 7px;
      height: 7px;
      background: var(--red);
      border-radius: 50%;
      border: 1.5px solid var(--bg)
    }

    /* ── LAYOUT ── */
    .main {
      padding-top: calc(var(--nav-h) + 12px);
      padding-bottom: calc(var(--bot-h) + 16px);
      max-width: 680px;
      margin: 0 auto;
      padding-left: 16px;
      padding-right: 16px
    }

    .panel {
      display: none
    }

    .panel.active {
      display: block
    }

    /* ── CARDS ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 12px
    }

    /* ── COMPOSE ── */
    .compose {
      padding: 14px 16px
    }

    .compose-top {
      display: flex;
      gap: 10px;
      align-items: flex-start
    }

    .compose-body {
      flex: 1
    }

    .compose-ta {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 15px;
      resize: none;
      outline: none;
      min-height: 48px;
      line-height: 1.5
    }

    .compose-ta::placeholder {
      color: var(--dim)
    }

    .compose-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border)
    }

    .compose-actions {
      display: flex;
      gap: 4px
    }

    .compose-action {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: .15s
    }

    .compose-action:hover {
      background: var(--surface2);
      color: var(--green)
    }

    .attach-preview {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface2);
      border-radius: 8px;
      padding: 7px 10px;
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted)
    }

    .attach-preview button {
      background: transparent;
      border: none;
      color: var(--dim);
      cursor: pointer;
      margin-left: auto;
      font-size: 16px;
      line-height: 1
    }

    .btn-post {
      background: var(--green);
      border: none;
      color: #fff;
      padding: 8px 18px;
      border-radius: 20px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: .15s
    }

    .btn-post:hover {
      background: var(--green-dark)
    }

    .btn-post:disabled {
      opacity: .4;
      cursor: default
    }

    /* ── POST ── */
    .post {
      padding: 14px 16px
    }

    .post-header {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px
    }

    .post-av {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0
    }

    .post-meta {
      flex: 1
    }

    .post-name {
      font-weight: 600;
      font-size: 14px;
      line-height: 1.2
    }

    .post-sub {
      color: var(--muted);
      font-size: 12px;
      margin-top: 1px
    }

    .post-time {
      color: var(--dim);
      font-size: 12px;
      white-space: nowrap
    }

    .post-text {
      font-size: 14px;
      line-height: 1.65;
      color: #e4e4e7;
      margin-bottom: 12px;
      white-space: pre-wrap
    }

    .post-media {
      width: 100%;
      border-radius: 12px;
      max-height: 400px;
      object-fit: cover;
      margin-bottom: 12px;
      display: block
    }

    .post-doc {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--surface2);
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 12px
    }

    .post-doc-name {
      font-size: 13px;
      font-weight: 500;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .post-doc-dl {
      background: var(--green);
      border: none;
      color: #fff;
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer
    }

    .post-actions {
      display: flex;
      gap: 4px
    }

    .post-act {
      background: transparent;
      border: none;
      color: var(--muted);
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 6px 10px;
      border-radius: 8px;
      transition: .15s;
      font-weight: 500
    }

    .post-act:hover {
      background: var(--surface2);
      color: var(--text)
    }

    .post-act.liked {
      color: var(--red)
    }

    .post-act.liked svg {
      fill: var(--red)
    }

    .role-pill {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 10px;
      text-transform: capitalize;
      margin-left: 5px
    }

    .role-pill.alumni {
      background: #00663325;
      color: var(--green)
    }

    .role-pill.student {
      background: #ec489925;
      color: var(--pink)
    }

    .role-pill.staff {
      background: #e8c96e25;
      color: var(--gold-light)
    }

    /* ── PEOPLE ── */
    .search-wrap {
      position: sticky;
      top: var(--nav-h);
      background: var(--bg);
      padding: 10px 0;
      z-index: 10;
      margin-bottom: 4px
    }

    .search-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px 14px 11px 40px;
      font-family: inherit;
      font-size: 14px;
      color: var(--text);
      outline: none;
      transition: .15s
    }

    .search-input:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px #00663315;
    }

    .search-input::placeholder {
      color: var(--dim)
    }

    .search-icon-wrap {
      position: relative
    }

    .search-icon-wrap svg {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--dim);
      pointer-events: none
    }

    .person-card {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 14px 16px
    }

    .person-card+.person-card {
      border-top: 1px solid var(--border)
    }

    .person-av {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0
    }

    .person-info {
      flex: 1;
      min-width: 0
    }

    .person-name {
      font-weight: 600;
      font-size: 14px
    }

    .person-detail {
      color: var(--muted);
      font-size: 12px;
      margin-top: 2px
    }

    .person-bio {
      color: var(--dim);
      font-size: 12px;
      margin-top: 3px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .btn-follow {
      border: 1.5px solid var(--border2);
      background: transparent;
      color: var(--text);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: .15s;
      white-space: nowrap;
      font-family: inherit
    }

    .btn-follow:hover {
      border-color: var(--green);
      color: var(--green)
    }

    .btn-follow.msg-btn {
      background: var(--green);
      border-color: var(--green);
      color: #fff
    }

    .btn-follow.msg-btn:hover {
      background: var(--green-dark);
      border-color: var(--green-dark)
    }

    /* ── MESSAGES ── */
    .msg-container {
      height: calc(100vh - var(--nav-h) - var(--bot-h));
      display: flex;
      flex-direction: column
    }

    .convo-list {
      overflow-y: auto;
      flex: 1
    }

    .convo-hdr {
      padding: 14px 16px;
      font-weight: 600;
      font-size: 15px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px
    }

    .convo-item {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 12px 16px;
      cursor: pointer;
      transition: .15s;
      border-bottom: 1px solid rgba(39, 39, 42, .5)
    }

    .convo-item:hover,
    .convo-item.active {
      background: #00663309;
    }

    .convo-av {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0
    }

    .convo-info {
      flex: 1;
      min-width: 0
    }

    .convo-name {
      font-weight: 600;
      font-size: 14px
    }

    .convo-last {
      color: var(--dim);
      font-size: 12px;
      margin-top: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .convo-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px
    }

    .convo-time {
      color: var(--dim);
      font-size: 11px
    }

    .unread-badge {
      background: var(--green);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 10px
    }

    .chat-view {
      display: none;
      flex-direction: column;
      height: calc(100vh - var(--nav-h) - var(--bot-h))
    }

    .chat-view.open {
      display: flex
    }

    .chat-hdr {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0
    }

    .chat-back {
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      margin-right: 2px;
      display: flex;
      align-items: center
    }

    .chat-hdr-av {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0
    }

    .chat-hdr-name {
      font-weight: 600;
      font-size: 14px
    }

    .chat-hdr-sub {
      color: var(--muted);
      font-size: 11px
    }

    .chat-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 2px
    }

    .bubble-row {
      display: flex;
      align-items: flex-end;
      margin-bottom: 2px
    }

    .bubble-row.mine {
      flex-direction: row-reverse
    }

    .bubble-row.theirs {
      justify-content: flex-start
    }

    .bubble-av {
      display: none
    }

    .bubble-wrap {
      display: flex;
      flex-direction: column;
      max-width: 72%
    }

    .bubble-row.mine .bubble-wrap {
      align-items: flex-end
    }

    .bubble-row.theirs .bubble-wrap {
      align-items: flex-start
    }

    .bubble {
      display: inline-block;
      padding: 9px 13px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.55;
      word-break: break-word;
      word-wrap: break-word;
      white-space: pre-wrap;
      max-width: 100%;
      box-sizing: border-box;
    }

    .bubble-row.theirs .bubble {
      background: transparent;
      color: var(--text);
      border: 1.5px solid var(--border2);
      border-bottom-left-radius: 4px
    }

    .bubble-row.mine .bubble {
      background: var(--green);
      color: #fff;
      border: 1.5px solid transparent;
      border-bottom-right-radius: 4px
    }

    .bubble-time {
      font-size: 10px;
      color: var(--dim);
      margin-top: 3px;
      padding: 0 2px
    }

    .bubble-media {
      max-width: 220px;
      border-radius: 10px;
      display: block;
      margin-bottom: 4px
    }

    .bubble-doc {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: rgba(255, 255, 255, .08);
      border-radius: 8px;
      font-size: 12px
    }

    .chat-input-row {
      padding: 10px 14px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
      align-items: flex-end;
      flex-shrink: 0
    }

    .chat-input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 20px;
      padding: 9px 14px;
      font-family: inherit;
      font-size: 14px;
      color: var(--text);
      outline: none;
      transition: .15s;
      resize: none;
      max-height: 80px;
      line-height: 1.4
    }

    .chat-input:focus {
      border-color: var(--green)
    }

    .chat-input::placeholder {
      color: var(--dim)
    }

    .chat-input-actions {
      display: flex;
      gap: 6px;
      align-items: center
    }

    .chat-act-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: .15s
    }

    .chat-act-btn:hover {
      background: var(--surface2);
      color: var(--green)
    }

    .chat-send {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--green);
      border: none;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: .15s
    }

    .chat-send:hover {
      background: var(--green-dark)
    }

    .msg-attach-preview {
      font-size: 11px;
      color: var(--muted);
      padding: 4px 14px;
      display: none
    }

    /* ── AI CHAT ── */
    .ai-wrap {
      display: flex;
      flex-direction: column;
      height: calc(100vh - var(--nav-h) - var(--bot-h))
    }

    .ai-hdr {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      background: linear-gradient(135deg, #00663315, #004d2615);
    }

    .ai-hdr-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--green), var(--green-dark));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px
    }

    .ai-hdr-name {
      font-weight: 700;
      font-size: 14px
    }

    .ai-hdr-sub {
      font-size: 11px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 4px
    }

    .ai-hdr-sub::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      display: inline-block
    }

    .ai-chips {
      display: flex;
      gap: 6px;
      padding: 10px 14px;
      overflow-x: auto;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0
    }

    .ai-chips::-webkit-scrollbar {
      display: none
    }

    .ai-chip {
      background: var(--surface2);
      border: 1px solid var(--border2);
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      padding: 5px 12px;
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
      transition: .15s;
      font-family: inherit;
      flex-shrink: 0
    }

    .ai-chip:hover {
      border-color: var(--green);
      color: var(--green)
    }

    .ai-msgs {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px
    }

    .ai-msg {
      display: flex;
      gap: 8px
    }

    .ai-msg.user {
      flex-direction: row-reverse
    }

    .ai-av {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--green), var(--green-dark));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
      align-self: flex-end
    }

    .ai-msg.user .ai-av {
      background: var(--surface2);
      font-size: 11px;
      color: var(--text)
    }

    .ai-bubble {
      max-width: 78%;
      padding: 10px 13px;
      border-radius: 16px;
      font-size: 13.5px;
      line-height: 1.55
    }

    .ai-msg.bot .ai-bubble {
      background: var(--surface2);
      color: var(--text);
      border-bottom-left-radius: 4px
    }

    .ai-msg.user .ai-bubble {
      background: var(--green);
      color: #fff;
      border-bottom-right-radius: 4px
    }

    .ai-typing {
      display: none;
      padding: 0 16px 6px
    }

    .ai-typing.show {
      display: flex;
      gap: 8px;
      align-items: center
    }

    .ai-dots {
      background: var(--surface2);
      padding: 10px 13px;
      border-radius: 16px;
      border-bottom-left-radius: 4px;
      display: flex;
      gap: 4px
    }

    .ai-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      animation: bounce .9s ease-in-out infinite
    }

    .ai-dot:nth-child(2) {
      animation-delay: .15s
    }

    .ai-dot:nth-child(3) {
      animation-delay: .3s
    }

    @keyframes bounce {

      0%,
      60%,
      100% {
        transform: translateY(0)
      }

      30% {
        transform: translateY(-5px)
      }
    }

    .ai-input-row {
      padding: 10px 14px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
      align-items: flex-end;
      flex-shrink: 0
    }

    .ai-input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: 20px;
      padding: 9px 14px;
      font-family: inherit;
      font-size: 14px;
      color: var(--text);
      outline: none;
      resize: none;
      max-height: 80px;
      transition: .15s;
      line-height: 1.4
    }

    .ai-input:focus {
      border-color: var(--green)
    }

    .ai-input::placeholder {
      color: var(--dim)
    }

    .ai-send {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--green);
      border: none;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: .15s
    }

    .ai-send:hover {
      background: var(--green-dark)
    }

    /* ── PROFILE ── */
    .prof-banner {
      height: 100px;
      background: linear-gradient(135deg, #1e4b1b, var(--green-dark), #1e4b1b)
    }

    .prof-av-wrap {
      padding: 0 16px;
      margin-top: -36px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 12px
    }

    .prof-av-big {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 3px solid var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 700;
      color: #fff;
      overflow: hidden;
      cursor: pointer;
      position: relative
    }

    .prof-av-big img {
      width: 100%;
      height: 100%;
      object-fit: cover
    }

    .prof-av-edit {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 22px;
      height: 22px;
      background: var(--green);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--bg)
    }

    .prof-edit-btn {
      background: transparent;
      border: 1.5px solid var(--border2);
      color: var(--text);
      padding: 7px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: .15s
    }

    .prof-edit-btn:hover {
      border-color: var(--green);
      color: var(--green)
    }

    .prof-body {
      padding: 0 16px 16px
    }

    .prof-name {
      font-size: 18px;
      font-weight: 700
    }

    .prof-handle {
      color: var(--muted);
      font-size: 13px;
      margin-top: 2px
    }

    .prof-bio {
      color: #e4e4e7;
      font-size: 14px;
      margin-top: 8px;
      line-height: 1.5
    }

    .prof-stats {
      display: flex;
      gap: 20px;
      margin-top: 12px
    }

    .prof-stat-n {
      font-weight: 700;
      font-size: 16px
    }

    .prof-stat-l {
      color: var(--muted);
      font-size: 12px
    }

    .empty-state {
      text-align: center;
      padding: 48px 24px;
      color: var(--dim)
    }

    .empty-icon {
      font-size: 40px;
      opacity: .4;
      margin-bottom: 10px
    }

    .empty-text {
      font-size: 14px
    }

    /* ── ANIM ── */
    @keyframes fadein {
      from {
        opacity: 0;
        transform: translateY(6px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    .fi {
      animation: fadein .2s ease
    }

    /* ── FILE INPUT ── */
    input[type=file] {
      display: none
    }

    /* ── DESKTOP tweak ── */
    @media(min-width:640px) {
      .main {
        padding-left: 24px;
        padding-right: 24px
      }

      .botnav {

        border-radius: 20px 20px 0 0;
        border-left: 1px solid var(--border);
        border-right: 1px solid var(--border)
      }
    }
  </style>
</head>

  <script>
    let ME = null, aiHistory = [], activeConvo = null, msgPollTimer = null, postAttachFile = null, msgAttachFile = null;

    async function init() {
      const r = await fetch('/api/me');
      if (r.status === 401) {window.location = '/login'; return;}
      ME = await r.json();
      const ini = initials(ME.name), col = ME.avatar_color || '#6366f1';
      ['top-av', 'compose-av'].forEach(id => {
        const el = document.getElementById(id);
        if (el) {el.textContent = ini; el.style.background = col;}
      });
      document.getElementById('prof-av-initials').textContent = ini;
      document.getElementById('prof-av-big').style.background = col;
      document.getElementById('prof-name').textContent = ME.name;
      document.getElementById('prof-handle').textContent = (ME.role || '') + (ME.faculty ? ' · ' + ME.faculty : '') + (ME.grad_year ? ' · ' + ME.grad_year : '');
      document.getElementById('prof-bio').textContent = ME.bio || '';
      // load avatar photo if any
      fetch('/api/avatar/' + ME.id).then(r => r.json()).then(d => {
        if (d.avatar) {setAvImg(d.avatar);}
      });
      loadPosts(); loadPeople(); loadConversations(); aiGreet();
      setInterval(loadConversations, 8000);
    }

    function initials(n) {const p = n.trim().split(' '); return (p[0][0] + (p[1] ? p[1][0] : '')).toUpperCase();}
    function esc(s) {return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');}
    function timeAgo(dt) {
      const d = new Date(dt.includes('Z') || dt.includes('+') ? dt : dt + 'Z');
      const s = Math.floor((Date.now() - d) / 1000);
      if (s < 60) return 'just now'; if (s < 3600) return Math.floor(s / 60) + 'm';
      if (s < 86400) return Math.floor(s / 3600) + 'h'; return Math.floor(s / 86400) + 'd';
    }
    function setAvImg(src) {
      const img = document.getElementById('prof-av-img'), ini = document.getElementById('prof-av-initials');
      img.src = src; img.style.display = 'block'; ini.style.display = 'none';
      document.getElementById('top-av').innerHTML = `<img src="${src}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`;
    }

    function showPanel(name) {
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.getElementById('panel-' + name).classList.add('active');
      ['feed', 'people', 'messages', 'ai', 'profile'].forEach((n, i) => {
        const btn = document.getElementById('bnav-' + n);
        if (btn) btn.classList.toggle('active', n === name);
      });
      if (name === 'messages') {loadConversations();}
      if (name === 'profile') {loadMyPosts();}
    }

    // ── POSTS ──────────────────────────────────────────────────────
    let postAttachType = null;
    function attachPostFile(inp, type) {postAttachFile = inp.files[0]; postAttachType = type; if (postAttachFile) {document.getElementById('post-attach-name').textContent = postAttachFile.name; document.getElementById('post-attach-preview').style.display = 'flex';} }
    function clearPostAttach() {postAttachFile = null; document.getElementById('post-attach-preview').style.display = 'none'; document.getElementById('post-photo-input').value = ''; document.getElementById('post-doc-input').value = '';}

    async function submitPost() {
      const ta = document.getElementById('post-ta');
      const content = ta.value.trim();
      if (!content && !postAttachFile) return;
      const fd = new FormData();
      fd.append('content', content);
      if (postAttachFile) fd.append('media', postAttachFile);
      ta.value = ''; ta.style.height = 'auto'; clearPostAttach();
      await fetch('/api/posts', {method: 'POST', body: fd});
      loadPosts();
    }

    async function loadPosts() {
      const r = await fetch('/api/posts');
      const posts = await r.json();
      const myCount = posts.filter(p => p.user_id === ME.id).length;
      document.getElementById('stat-posts').textContent = myCount;
      renderPosts(posts, 'posts-list');
    }

    async function loadMyPosts() {
      const r = await fetch('/api/posts');
      const posts = await r.json();
      const mine = posts.filter(p => p.user_id === ME.id);
      document.getElementById('stat-posts').textContent = mine.length;
      renderPosts(mine, 'my-posts-list');
    }

    function renderPosts(posts, containerId) {
      const el = document.getElementById(containerId);
      if (!posts.length) {el.innerHTML = `<div class="empty-state"><div class="empty-icon">✍️</div><div class="empty-text">No posts yet</div></div>`; return;}
      el.innerHTML = posts.map(p => {
        const roleClass = p.role === 'alumni' ? 'alumni' : p.role === 'staff' ? 'staff' : 'student';
        let mediaHtml = '';
        if (p.media_type && p.media_name) {
          if (p.media_type.startsWith('image/') || p.media_type.startsWith('video/')) {
            mediaHtml = `<div style="margin-bottom:10px"><img src="" data-post-id="${p.id}" class="post-media lazy-media" alt="media" loading="lazy"></div>`;
          } else {
            mediaHtml = `<div class="post-doc"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><span class="post-doc-name">${esc(p.media_name)}</span><button class="post-doc-dl" onclick="downloadMedia(${p.id},'post')">Download</button></div>`;
          }
        }
        return `<div class="card fi" id="post-${p.id}">
      <div class="post">
        <div class="post-header">
          <div class="post-av" style="background:${p.avatar_color || '#6366f1'}">${initials(p.name)}</div>
          <div class="post-meta">
            <div class="post-name">${esc(p.name)}<span class="role-pill ${roleClass}">${p.role || 'member'}</span></div>
            <div class="post-sub">${esc(p.faculty || 'IUIU')}</div>
          </div>
          <div class="post-time">${timeAgo(p.created_at)}</div>
        </div>
        ${p.content ? `<div class="post-text">${esc(p.content)}</div>` : ''}
        ${mediaHtml}
        <div class="post-actions">
          <button class="post-act ${p.liked ? 'liked' : ''}" id="like-${p.id}" onclick="toggleLike(${p.id})">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="${p.liked ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            <span id="lc-${p.id}">${p.likes}</span>
          </button>
          ${p.user_id !== ME.id ? `<button class="post-act" onclick="openConvo(${p.user_id},'${esc(p.name)}','${p.avatar_color || '#6366f1'}')">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            Message
          </button>`: ''}
        </div>
      </div>
    </div>`;
      }).join('');
      // lazy load media
      document.querySelectorAll('.lazy-media[data-post-id]').forEach(img => {
        const pid = img.dataset.postId;
        fetch(`/api/posts/${pid}/media`).then(r => r.json()).then(d => {if (d.media) {img.src = d.media;} else {img.style.display = 'none';} });
      });
    }

    async function toggleLike(pid) {
      const r = await fetch(`/api/posts/${pid}/like`, {method: 'POST'});
      const d = await r.json();
      const btn = document.getElementById(`like-${pid}`);
      const cnt = document.getElementById(`lc-${pid}`);
      btn.className = `post-act ${d.liked ? 'liked' : ''}`;
      btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="${d.liked ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg><span id="lc-${pid}">${d.likes}</span>`;
    }

    async function downloadMedia(id, type) {
      const url = type === 'post' ? `/api/posts/${id}/media` : `/api/messages/${activeConvo}/media/${id}`;
      const r = await fetch(url); const d = await r.json();
      if (d.media) {const a = document.createElement('a'); a.href = d.media; a.download = 'file'; a.click();}
    }

    // ── PEOPLE ──────────────────────────────────────────────────────
    async function loadPeople(q = '') {
      const r = await fetch('/api/users' + (q ? `?q=${encodeURIComponent(q)}` : ''));
      const users = await r.json();
      const el = document.getElementById('people-list');
      if (!users.length) {el.innerHTML = `<div class="empty-state"><div class="empty-icon">👥</div><div class="empty-text">No users found</div></div>`; return;}
      el.innerHTML = users.map(u => {
        const roleClass = u.role === 'alumni' ? 'alumni' : u.role === 'staff' ? 'staff' : 'student';
        return `<div class="person-card fi">
      <div class="person-av" style="background:${u.avatar_color || '#6366f1'}">${initials(u.name)}</div>
      <div class="person-info">
        <div class="person-name">${esc(u.name)}<span class="role-pill ${roleClass}">${u.role || 'member'}</span></div>
        <div class="person-detail">${esc(u.faculty || 'IUIU')}${u.grad_year ? ' · Class of ' + u.grad_year : ''}</div>
        ${u.bio ? `<div class="person-bio">${esc(u.bio)}</div>` : ''}
      </div>
      <button class="btn-follow msg-btn" onclick="openConvo(${u.id},'${esc(u.name)}','${u.avatar_color || '#6366f1'}')">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      </button>
    </div>`;
      }).join('');
    }

    let searchTimer;
    function searchPeople(q) {clearTimeout(searchTimer); searchTimer = setTimeout(() => loadPeople(q), 300);}

    // ── MESSAGES ──────────────────────────────────────────────────
    async function loadConversations() {
      const r = await fetch('/api/conversations');
      const convos = await r.json();
      const el = document.getElementById('convo-list-items');
      const totalUnread = convos.reduce((a, c) => a + (c.unread || 0), 0);
      const badge = document.getElementById('msg-badge');
      badge.style.display = totalUnread > 0 ? 'block' : 'none';
      if (!convos.length) {el.innerHTML = `<div class="empty-state"><div class="empty-icon">💬</div><div class="empty-text">No conversations yet.<br>Find someone in People!</div></div>`; return;}
      el.innerHTML = convos.map(c => `
    <div class="convo-item ${activeConvo === c.id ? 'active' : ''}" onclick="openConvo(${c.id},'${esc(c.name)}','${c.avatar_color || '#6366f1'}')">
      <div class="convo-av" style="background:${c.avatar_color || '#6366f1'}">${initials(c.name)}</div>
      <div class="convo-info">
        <div class="convo-name">${esc(c.name)}</div>
        <div class="convo-last">${esc(c.last_message || '')}</div>
      </div>
      <div class="convo-meta">
        <div class="convo-time">${timeAgo(c.created_at)}</div>
        ${c.unread > 0 ? `<div class="unread-badge">${c.unread}</div>` : ''}
      </div>
    </div>
  `).join('');
    }

    async function openConvo(userId, name, color) {
      activeConvo = userId; clearInterval(msgPollTimer);
      showPanel('messages');
      document.getElementById('convo-view').style.display = 'none';
      const cv = document.getElementById('chat-view'); cv.classList.add('open');
      const hdrAv = document.getElementById('chat-hdr-av');
      hdrAv.style.background = color; hdrAv.textContent = initials(name);
      document.getElementById('chat-hdr-name').textContent = name;
      await fetchMsgs(userId);
      msgPollTimer = setInterval(() => fetchMsgs(userId), 4000);
      document.getElementById('chat-input').focus();
    }

    function closeChat() {
      clearInterval(msgPollTimer); activeConvo = null;
      document.getElementById('chat-view').classList.remove('open');
      document.getElementById('convo-view').style.display = 'block';
      loadConversations();
    }

    async function fetchMsgs(uid) {
      const r = await fetch(`/api/messages/${uid}`);
      const msgs = await r.json();
      const body = document.getElementById('chat-body');
      if (!body) return;
      if (!msgs.length) {body.innerHTML = `<div class="empty-state"><div class="empty-icon">👋</div><div class="empty-text">Say Assalamu Alaikum!</div></div>`; return;}
      body.innerHTML = msgs.map(m => {
        const mine = m.sender_id === ME.id;
        let mediaHtml = '';
        if (m.media_type && m.media_name) {
          if (m.media_type.startsWith('image/')) {
            mediaHtml = `<img src="" data-msg-id="${m.id}" class="bubble-media lazy-msg-media" alt="img">`;
          } else {
            mediaHtml = `<div class="bubble-doc"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px">${esc(m.media_name)}</span><button style="background:var(--green);border:none;color:#fff;padding:3px 8px;border-radius:6px;font-size:11px;cursor:pointer" onclick="downloadMedia(${m.id},'msg')">↓</button></div>`;
          }
        }
        return `<div class="bubble-row ${mine ? 'mine' : 'theirs'} fi">
      <div class="bubble-wrap">
        ${mediaHtml}
        ${m.content ? `<div class="bubble">${esc(m.content)}</div>` : ''}
        <div class="bubble-time">${timeAgo(m.created_at)}</div>
      </div>
    </div>`;
      }).join('');
      // lazy load msg images
      document.querySelectorAll('.lazy-msg-media[data-msg-id]').forEach(img => {
        const mid = img.dataset.msgId;
        fetch(`/api/messages/${uid}/media/${mid}`).then(r => r.json()).then(d => {if (d.media) img.src = d.media;});
      });
      body.scrollTop = body.scrollHeight;
    }

    function attachMsgFile(inp) {msgAttachFile = inp.files[0]; if (msgAttachFile) {const prev = document.getElementById('msg-attach-prev'); prev.style.display = 'block'; prev.textContent = '📎 ' + msgAttachFile.name;} }

    async function sendMsg() {
      const input = document.getElementById('chat-input');
      const content = input.value.trim();
      if (!content && !msgAttachFile) return;
      const fd = new FormData();
      fd.append('content', content);
      if (msgAttachFile) {fd.append('media', msgAttachFile); msgAttachFile = null; document.getElementById('msg-attach-prev').style.display = 'none'; document.getElementById('msg-photo-input').value = ''; document.getElementById('msg-doc-input').value = '';}
      input.value = ''; input.style.height = 'auto';
      await fetch(`/api/messages/${activeConvo}`, {method: 'POST', body: fd});
      fetchMsgs(activeConvo); loadConversations();
    }

    // ── AI ──────────────────────────────────────────────────────────
    function aiGreet() {const n = ME ? ME.name.split(' ')[0] : 'there'; addAiMsg('bot', `Assalamu Alaikum, ${n}! 👋 I'm your IUIU alumni assistant. Ask me anything about mentors, events, transcripts, or university info.`);}
    async function aiSend() {
      const input = document.getElementById('ai-input');
      const text = input.value.trim(); if (!text) return;
      input.value = ''; input.style.height = 'auto';
      addAiMsg('user', text); aiHistory.push({role: 'user', content: text});
      document.getElementById('ai-typing').classList.add('show');
      const r = await fetch('/api/chat', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({messages: aiHistory})});
      const d = await r.json();
      document.getElementById('ai-typing').classList.remove('show');
      addAiMsg('bot', d.reply); aiHistory.push({role: 'assistant', content: d.reply});
    }
    function aiChip(t) {document.getElementById('ai-input').value = t; aiSend();}
    function addAiMsg(role, text) {
      const el = document.getElementById('ai-msgs');
      const div = document.createElement('div'); div.className = `ai-msg ${role} fi`;
      const fmt = esc(text).replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
      div.innerHTML = `<div class="ai-av">${role === 'bot' ? '🤖' : '👤'}</div><div class="ai-bubble">${fmt}</div>`;
      el.appendChild(div); el.scrollTop = el.scrollHeight;
    }

    // ── PROFILE / AVATAR ───────────────────────────────────────────
    async function uploadAvatar(inp) {
      const file = inp.files[0]; if (!file) return;
      const fd = new FormData(); fd.append('file', file);
      const r = await fetch('/api/me/avatar', {method: 'POST', body: fd});
      const d = await r.json();
      if (d.ok) setAvImg(d.avatar);
    }

    init();
  </script>
</body>

</html>
