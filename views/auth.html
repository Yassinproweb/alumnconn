<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlumnConnect — IUIU</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #09090b;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px
    }

    /* Warning: Non-standard. Works primarily in Chrome/Safari/Edge */
    .year-only::-webkit-datetime-edit-day-field,
    .year-only::-webkit-datetime-edit-month-field,
    .year-only::-webkit-datetime-edit-text {
      display: none;
    }

    .wrap {
      width: 100%;
      max-width: 420px
    }

    .logo {
      text-align: center;
      margin-bottom: 28px
    }

    .logo-ring {
      width: 60px;
      height: 60px;
      border-radius: 18px;
      background: linear-gradient(135deg, #006633, #004d2c);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 14px;
      font-size: 26px
    }

    .logo h1 {
      color: #fff;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -.4px
    }

    .logo p {
      color: #71717a;
      font-size: 13px;
      margin-top: 3px
    }

    .card {
      background: #181b18;
      border: 1px solid #27272a;
      border-radius: 20px;
      padding: 28px
    }

    .tabs {
      display: flex;
      background: #09090b;
      border-radius: 10px;
      padding: 3px;
      margin-bottom: 24px
    }

    .tab {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: .2s;
      background: transparent;
      color: #71717a
    }

    .tab.active {
      background: #006633;
      color: #fff
    }

    .fg {
      margin-bottom: 14px
    }

    .fg label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #a1a1aa;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: .5px
    }

    .fg input,
    .fg select,
    .fg textarea {
      width: 100%;
      background: #09090b;
      border: 1px solid #27272a;
      border-radius: 10px;
      padding: 10px 13px;
      font-family: inherit;
      font-size: 14px;
      color: #fafafa;
      outline: none;
      transition: .15s
    }

    .fg input:focus,
    .fg select:focus,
    .fg textarea:focus {
      border-color: #006633;
      box-shadow: 0 0 0 3px #00663325;
    }

    .fg input::placeholder,
    .fg textarea::placeholder {
      color: #52525b
    }

    .fg select option {
      background: #181b18
    }

    .fg textarea {
      resize: none
    }

    .row2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px
    }

    .btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #006633, #004d2c);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
      transition: .15s
    }

    .btn:hover {
      opacity: .9;
      transform: translateY(-1px)
    }

    .err {
      background: #1c0a0a;
      border: 1px solid #7f1d1d;
      color: #fca5a5;
      border-radius: 8px;
      padding: 9px 13px;
      font-size: 12px;
      margin-bottom: 14px;
      display: none
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="logo">
      <div class="logo-ring">🎓</div>
      <h1>AlumnConnect</h1>
      <p>Islamic University in Uganda</p>
    </div>

    <div class="card">
      <div class="tabs">
        <!-- Fixed Go template syntax -->
        <button class="tab {{if eq .Mode `login`}}active{{end}}" onclick="sw('login')">
          Sign in
        </button>

        <button class="tab {{if eq .Mode `register`}}active{{end}}" onclick="sw('register')">
          Create account
        </button>
      </div>

      <div id="err" class="err"></div>

      <!-- Login section -->
      <div id="lf" style="display:{{if eq .Mode `login`}}block{{else}}none{{end}}">
        <form method="post" hx-post="/login" hx-swap="none" class="">
          <div class="fg">
            <label for="email">Email</label>
            <input id="le" type="email" name="email" placeholder="you@email.com" value="{{.Email}}">
          </div>

          <div class="fg">
            <label for="lp">Password</label>
            <input id="lp" type="password" placeholder="••••••••" name="password">
          </div>

          <button class="btn" type="submit">Sign in</button>
        </form>
      </div>

      <!-- Register section -->
      <div id="sf" style="display:{{if eq .Mode `register`}}block{{else}}none{{end}}">
        <form method="post" hx-post="/register" hx-swap="none" class="">
          <div class="fg">
            <label for="name">Full name</label>
            <input id="sn" name="username" type="text" required placeholder="Full name">
          </div>

          <div class="fg">
            <label for="email">Email</label>
            <input id="se" name="email" type="email" required placeholder="you@email.com">
          </div>

          <div class="row2">
            <div class="fg">
              <label for="role">I am a/an</label>
              <select id="sr" name="role" required>
                <option value="student">Student</option>
                <option value="alumni">Alumni</option>
                <option value="staff">Staff</option>
              </select>
            </div>

            <div class="fg">
              <label for="entryYear">Entry Year</label>
              <input id="sy" name="entryYear" type="number" required placeholder="2024">
            </div>
          </div>

          <div class="fg">
            <label for="faculty">Faculty</label>
            <select id="sf2" name="faculty" required>
              <option value="">Select faculty</option>
              {{range .Faculties}}
              <option>{{.}}</option>
              {{end}}
            </select>
          </div>

          <div class="fg">
            <label for="bio">Bio</label>
            <textarea id="sb" name="bio" rows="2" placeholder="Tell the community about yourself..."></textarea>
          </div>

          <div class="fg">
            <label for="password">Password</label>
            <input id="sp" name="password" type="password" required placeholder="Min 6 characters">
          </div>

          <button class="btn" type="submit">Create account</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    function sw(t) {
      document.getElementById("lf").style.display = t === "login" ? "block" : "none";
      document.getElementById("sf").style.display = t === "register" ? "block" : "none";

      document.querySelectorAll(".tab").forEach((el, i) => {
        el.classList.toggle(
          "active",
          (t === "login" && i === 0) ||
          (t === "register" && i === 1)
        )
      });

      document.getElementById("err").style.display = "none";
    }

    function err(m) {
      const e = document.getElementById("err");

      e.textContent = m;
      e.style.display = "block";
    }
  </script>

</body>

</html>
