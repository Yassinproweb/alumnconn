<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlumnConnect — IUIU</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@400;500;600&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="/css/style.min.css">
  <script src="/js/htmx.min.js" defer></script>
  <style>
    /* year-only input: non-standard, Chrome/Safari/Edge only */
    .year-only::-webkit-datetime-edit-day-field,
    .year-only::-webkit-datetime-edit-month-field,
    .year-only::-webkit-datetime-edit-text {
      display: none;
    }

    /* Custom green focus ring using CSS variable */
    .focus-green:focus {
      outline: none;
      border-color: #006633;
      box-shadow: 0 0 0 3px rgba(0, 102, 51, 0.18);
    }

    /* HTMX loading indicator */
    .htmx-indicator {
      display: none;
    }

    .htmx-request .htmx-indicator {
      display: inline-block;
    }

    .htmx-request.htmx-indicator {
      display: inline-block;
    }
  </style>
</head>

<body class="bg-[#09090b] min-h-screen flex items-center justify-center p-5 font-['DM_Sans',sans-serif]">

  <div class="w-full max-w-[420px]">

    <!-- Logo -->
    <div class="text-center mb-7">
      <div
        class="size-14 rounded-[18px] bg-gradient-to-br from-[#006633] to-[#004d2c] flex items-center justify-center mx-auto mb-3.5 text-[26px]">
        <i class="hgi hgi-stroke hgi-graduate-male text-5xl text-white"></i>
      </div>
      <h1 class="text-white text-[22px] font-bold tracking-tight font-serif">AlumnConnect</h1>
      <p class="text-green_pale text-base mt-1">Islamic University in Uganda</p>
    </div>

    <!-- Card -->
    <div class="bg-[#181b18] border border-zinc-800 rounded-[20px] p-7">

      <!-- Tabs -->
      <div class="flex bg-[#09090b] rounded-[10px] p-[3px] mb-6">
        <button id="tab-login"
          class="flex-1 py-2 rounded-lg text-base font-medium cursor-pointer transition-all duration-200 {{ if eq .Mode `login` }}bg-[#006633] text-white{{ else }}bg-transparent text-green_pale hover:text-green_mid{{ end }}"
          onclick="sw('login')">
          Sign in
        </button>
        <button id="tab-register"
          class="flex-1 py-2 rounded-lg text-base font-medium cursor-pointer transition-all duration-200 {{ if eq .Mode `register` }}bg-[#006633] text-white{{ else }}bg-transparent text-green_pale hover:text-green_mid{{ end }}"
          onclick="sw('register')">
          Create account
        </button>
      </div>

      <!-- Error banner -->
      <div id="err"
        class="hidden bg-[#1c0a0a] border border-red-900 text-red-300 rounded-lg px-3.5 py-2.5 text-xs mb-3.5"></div>

      <!-- ── LOGIN FORM ── -->
      <div id="lf" style="display:{{if eq .Mode `login`}}block{{else}}none{{end}}">
        <form method="post" hx-post="/login" hx-swap="none" hx-on::after-request="handleResponse(event, 'login')">

          <div class="mb-3.5">
            <label class="block text-[11px] font-semibold text-white mb-1.5 uppercase tracking-wide">Email</label>
            <input type="email" name="email" placeholder="you@email.com" value="{{.Email}}"
              class="focus-green w-full bg-[#09090b] border border-zinc-800 rounded-[10px] px-3.5 py-2.5 text-[14px] text-zinc-100 placeholder-zinc-600 transition-all duration-150">
          </div>

          <div class="mb-3.5">
            <label class="block text-[11px] font-semibold text-white mb-1.5 uppercase tracking-wide">Password</label>
            <input type="password" name="password" placeholder="••••••••"
              class="focus-green w-full bg-[#09090b] border border-zinc-800 rounded-[10px] px-3.5 py-2.5 text-[14px] text-zinc-100 placeholder-zinc-600 transition-all duration-150">
          </div>

          <button type="submit"
            class="w-full mt-1.5 py-3 bg-gradient-to-br from-[#006633] to-[#004d2c] border-none rounded-[10px] text-white text-[14px] font-semibold cursor-pointer transition-all duration-150 hover:opacity-90 hover:-translate-y-px flex items-center justify-center gap-2">
            <span>Sign in</span>
            <span class="htmx-indicator animate-spin text-xs">⏳</span>
          </button>
        </form>
      </div>

      <!-- ── REGISTER FORM ── -->
      <div id="sf" style="display:{{if eq .Mode `register`}}block{{else}}none{{end}}">
        <form method="post" hx-post="/register" hx-swap="none" hx-on::after-request="handleResponse(event, 'register')">

          <div class="mb-3.5">
            <label class="block text-[11px] font-semibold text-white mb-1.5 uppercase tracking-wide">Full
              name</label>
            <input name="username" type="text" required placeholder="Full name"
              class="focus-green w-full bg-[#09090b] border border-zinc-800 rounded-[10px] px-3.5 py-2.5 text-[14px] text-zinc-100 placeholder-zinc-600 transition-all duration-150">
          </div>

          <div class="mb-3.5">
            <label class="block text-[11px] font-semibold text-white mb-1.5 uppercase tracking-wide">Email</label>
            <input name="email" type="email" required placeholder="you@email.com"
              class="focus-green w-full bg-[#09090b] border border-zinc-800 rounded-[10px] px-3.5 py-2.5 text-[14px] text-zinc-100 placeholder-zinc-600 transition-all duration-150">
          </div>

          <div class="grid grid-cols-2 gap-2.5 mb-3.5">
            <div>
              <label class="block text-[11px] font-semibold text-white mb-1.5 uppercase tracking-wide">I am
                a/an</label>
              <select name="role" required
                class="focus-green w-full bg-[#09090b] border border-zinc-800 rounded-[10px] px-3.5 py-2.5 text-[14px] text-zinc-100 transition-all duration-150 [&>option]:bg-[#181b18]">
                <option value="student">Student</option>
                <option value="alumni">Alumni</option>
                <option value="staff">Staff</option>
              </select>
            </div>
            <div>
              <label class="block text-[11px] font-semibold text-white mb-1.5 uppercase tracking-wide">Entry
                Year</label>
              <input name="entryYear" type="number" required placeholder="2024" min="1988" max="2030"
                class="focus-green year-only w-full bg-[#09090b] border border-zinc-800 rounded-[10px] px-3.5 py-2.5 text-[14px] text-zinc-100 placeholder-zinc-600 transition-all duration-150">
            </div>
          </div>

          <div class="mb-3.5">
            <label class="block text-[11px] font-semibold text-white mb-1.5 uppercase tracking-wide">Faculty</label>
            <select name="faculty" required
              class="focus-green w-full bg-[#09090b] border border-zinc-800 rounded-[10px] px-3.5 py-2.5 text-[14px] text-zinc-100 transition-all duration-150 [&>option]:bg-[#181b18]">
              <option value="">Select faculty</option>
              {{range .Faculties}}
              <option>{{.}}</option>
              {{end}}
            </select>
          </div>

          <div class="mb-3.5">
            <label class="block text-[11px] font-semibold text-white mb-1.5 uppercase tracking-wide">Bio</label>
            <textarea name="bio" rows="2" placeholder="Tell the community about yourself..."
              class="focus-green w-full bg-[#09090b] border border-zinc-800 rounded-[10px] px-3.5 py-2.5 text-[14px] text-zinc-100 placeholder-zinc-600 transition-all duration-150 resize-none"></textarea>
          </div>

          <div class="mb-3.5">
            <label class="block text-[11px] font-semibold text-white mb-1.5 uppercase tracking-wide">Password</label>
            <input name="password" type="password" required placeholder="Min 6 characters"
              class="focus-green w-full bg-[#09090b] border border-zinc-800 rounded-[10px] px-3.5 py-2.5 text-[14px] text-zinc-100 placeholder-zinc-600 transition-all duration-150">
          </div>

          <button type="submit"
            class="w-full mt-1.5 py-3 bg-gradient-to-br from-[#006633] to-[#004d2c] border-none rounded-[10px] text-white text-[14px] font-semibold cursor-pointer transition-all duration-150 hover:opacity-90 hover:-translate-y-px flex items-center justify-center gap-2">
            <span>Create account</span>
            <span class="htmx-indicator animate-spin text-xs">⏳</span>
          </button>
        </form>
      </div>

    </div>
  </div>

  <script>
    function sw(t) {
      document.getElementById('lf').style.display = t === 'login' ? 'block' : 'none';
      document.getElementById('sf').style.display = t === 'register' ? 'block' : 'none';

      const loginTab = document.getElementById('tab-login');
      const registerTab = document.getElementById('tab-register');

      [loginTab, registerTab].forEach((btn, i) => {
        const isActive = (t === 'login' && i === 0) || (t === 'register' && i === 1);
        btn.classList.toggle('bg-[#006633]', isActive);
        btn.classList.toggle('text-white', isActive);
        btn.classList.toggle('bg-transparent', !isActive);
        btn.classList.toggle('text-green_pale', !isActive);
      });

      // Keep URL in sync
      const url = new URL(window.location);
      url.searchParams.set('mode', t);
      window.history.replaceState({}, '', url);

      showErr('');
    }

    function showErr(m) {
      const e = document.getElementById('err');
      if (m) {e.textContent = m; e.classList.remove('hidden');}
      else {e.classList.add('hidden');}
    }

    function handleResponse(evt, mode) {
      const xhr = evt.detail.xhr;
      if (xhr.status >= 200 && xhr.status < 300) {
        window.location.href = '/feed';
      } else {
        showErr(xhr.responseText || 'Something went wrong. Please try again.');
      }
    }

    // On page load: read ?mode param and switch to correct tab
    (function () {
      const params = new URLSearchParams(window.location.search);
      const mode = params.get('mode');
      if (mode === 'register') sw('register');
      else sw('login');
    })();
  </script>

</body>

</html>
